<h2 id="Implementations">Implementations</h2><span class="mw-editsection"><span class="mw-editsection-bracket">[</span><a href="/w/index.php?title=Markdown&amp;action=edit&amp;section=11" title="Edit section: Implementations"><span>edit</span></a><span class="mw-editsection-bracket">]</span></span></div>
<p id="mwAts">Implementations of Markdown are available for over a dozen <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Programming_language" title="Programming language" id="mwAtw">programming languages</a>; in addition, many <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Application_software" title="Application software" id="mwAt0">applications</a>, platforms and <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Software_framework" title="Software framework" id="mwAt4">frameworks</a> support Markdown.<sup about="#mwt266" class="mw-ref reference" id="cite_ref-54" rel="dc:references" typeof="mw:Extension/ref" data-mw='{"name":"ref","attrs":{},"body":{"id":"mw-reference-text-cite_note-54"}}'><a href="#cite_note-54" id="mwAt8"><span class="mw-reflink-text" id="mwAuA"><span class="cite-bracket" id="mwAuE">[</span>53<span class="cite-bracket" id="mwAuI">]</span></span></a></sup> For example, Markdown <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Plug-in_(computing)" title="Plug-in (computing)" id="mwAuM">plugins</a> exist for every major <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Blog" title="Blog" id="mwAuQ">blogging</a> platform.<sup about="#mwt267" class="mw-ref reference" id="cite_ref-ArsTechnica2014_13-2" rel="dc:references" typeof="mw:Extension/ref" data-mw='{"name":"ref","attrs":{"name":"ArsTechnica2014"}}'><a href="#cite_note-ArsTechnica2014-13" id="mwAuU"><span class="mw-reflink-text" id="mwAuY"><span class="cite-bracket" id="mwAuc">[</span>13<span class="cite-bracket" id="mwAug">]</span></span></a></sup></p>
